services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - ${QDRANT_STORAGE_PATH:-./data/qdrant_storage}:/qdrant/storage

  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please_change_me}
    volumes:
      - ${NEO4J_DATA_PATH:-./data/neo4j_data}:/data
      - ${NEO4J_LOGS_PATH:-./data/neo4j_logs}:/logs
